spring.application.name=securebank

spring.datasource.url=jdbc:mysql://localhost:3306/blockchain_bank?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

# Must be at least 32 characters (256-bit) for HS256
jwt.secret=${JWT_SECRET:change-this-super-secret-key-please-32chars-min}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Bootstrap administrator (created on startup if missing). Override in production.
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:Admin123!}

# Comma-separated CORS origin patterns (wildcards allowed).
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,https://*.vercel.app}
